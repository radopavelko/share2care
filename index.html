<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="theme-color" content="#F4F4F2" />
<title>ShareKeep — who has what</title>
<meta name="description" content="Share your things with people you trust, and always know who has what." />

<!-- Installable web app (Add to Home Screen) -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ShareKeep" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #E9E9E6;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button, input, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #A3A3A8; }

  #root { width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }

  /* Phone-shaped column: full-bleed on phones, a centred card on larger screens. */
  .s2-phone { position: relative; width: 100%; height: 100%; background: #F4F4F2; overflow: hidden; }
  @media (min-width: 480px) {
    .s2-phone { width: 420px; height: min(880px, 94vh); border-radius: 34px; border: 1px solid #E4E4E2; box-shadow: 0 24px 70px rgba(0,0,0,0.14); }
  }
  /* Installed on a home screen: always full-bleed. */
  @media (display-mode: standalone) {
    .s2-phone { width: 100%; height: 100%; border-radius: 0; border: none; box-shadow: none; }
  }

  .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
  .no-sb::-webkit-scrollbar { display: none; width: 0; height: 0; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes toastDown { from { transform: translateY(-14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes screenIn { from { transform: translateX(26px); } to { transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pulse-dot { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="module" src="firebase-init.js?v=2"></script>

<script type="text/babel" src="helpers.jsx"></script>
<script type="text/babel" src="theme.jsx"></script>
<script type="text/babel" src="screens-browse.jsx"></script>
<script type="text/babel" src="screens-borrows.jsx"></script>
<script type="text/babel" src="screens-lend.jsx"></script>
<script type="text/babel" src="screens-groups.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
